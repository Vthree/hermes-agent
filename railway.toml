# Railway 部署設定 — Hermes Agent（OpenAI 相容 proxy 模式）
#
# 用途：在 Railway 上跑 `hermes proxy`，讓 telegram-grok-bot / discord-grok-bot
#       透過 Railway 內網使用 SuperGrok 訂閱模型（grok-4.5），Hermes 離線時
#       bot 再 fallback 回 API。
#
# Railway 儀表板手動設定（railway.toml 無法涵蓋的部分）：
#   1. 服務 → Settings → Volumes → 新增 volume（建議 1GB）掛載在 /opt/data
#      （= HERMES_HOME，auth.json 存這裡，重啟/重新部署才不會掉登入）
#   2. 首次部署後：用 Railway Web Terminal（或 railway run bash）執行
#        hermes auth add xai-oauth
#      會印出網址 + 裝置碼，在瀏覽器用有 SuperGrok 訂閱的 X 帳號完成登入
#   3. 內網連線：bot 使用 http://<服務名稱>.railway.internal:8645/v1
#      （Railway 同專案服務之間可用 private networking，不需公開網域）
#   4. 若需要公開網域才開（不建議，proxy 對任何 bearer 都放行）

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "proxy start --provider xai --host 0.0.0.0"
# 注意：healthcheckPath 需要公開網域才能運作；本服務只用內網，故不設 healthcheck
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
