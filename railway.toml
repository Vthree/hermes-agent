# Railway 部署設定 — Hermes Agent（OpenAI 相容 proxy 模式）
#
# 必須用 Dockerfile.railway（去掉 Docker VOLUME）。

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
# TEMP: keep container alive for auth bootstrap; will restore proxy after auth.json is written
startCommand = "sh -c 'sleep infinity'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
